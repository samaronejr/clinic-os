  <title id="cop-c-dark-title">Clinic Ops — logo compact dark</title>
  <desc id="cop-c-dark-desc">Clinic Ops identity, edited from the existing Clinic OS vector assets. Only the OS suffix has been replaced with outlined Ops lettering; the original Clinic letter contours, symbol geometry, cyan/teal palette and Portuguese tagline are retained. Layout space is adjusted for the new suffix. Self-contained vectors; no raster images, external resources or font dependencies.</desc>
