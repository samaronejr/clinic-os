<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Clinic OS{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"
            defer></script>
    <style>
      :root {
        --color-ink: #1c2b2d;
        --color-ink-soft: #51686b;
        --color-surface: #f7f5f0;
        --color-surface-raised: #ffffff;
        --color-primary: #0f6b5c;
        --color-primary-strong: #0a4f44;
        --color-accent: #c96f2f;
        --color-line: #dcd6c9;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2.5rem;
        --radius-1: 0.375rem;
        --radius-2: 0.75rem;
        --font-body: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
          Georgia, serif;
        --font-display: "Avenir Next", "Segoe UI Variable", "Segoe UI",
          "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-surface);
        color: var(--color-ink);
        font-family: var(--font-body);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .skip-link {
        position: absolute;
        top: -100%;
        left: var(--space-3);
        padding: var(--space-2) var(--space-3);
        background: var(--color-primary-strong);
        color: var(--color-surface-raised);
        border-radius: 0 0 var(--radius-1) var(--radius-1);
        text-decoration: none;
        font-family: var(--font-display);
      }

      .skip-link:focus {
        top: 0;
      }

      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

      header,
      footer {
        padding: var(--space-3) var(--space-5);
        font-family: var(--font-display);
      }

      header {
        border-bottom: 1px solid var(--color-line);
      }

      .brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--color-primary-strong);
      }

      main {
        flex: 1;
        width: min(44rem, 100%);
        margin-inline: auto;
        padding: var(--space-5) var(--space-4);
      }

      h1 {
        font-family: var(--font-display);
        font-size: 2rem;
        text-wrap: balance;
        margin: 0 0 var(--space-3);
      }

      p {
        text-wrap: pretty;
        color: var(--color-ink-soft);
        margin: 0 0 var(--space-3);
      }

      footer {
        border-top: 1px solid var(--color-line);
        color: var(--color-ink-soft);
        font-size: 0.875rem;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
      <p class="brand">Clinic OS</p>
    </header>
    <main id="main-content" tabindex="-1">
      {% block content %}
      <section aria-labelledby="shell-heading">
        <h1 id="shell-heading">Foundation shell</h1>
        <p>The Clinic OS project shell is running.</p>
      </section>
      {% endblock %}
    </main>
    <footer>
      <p>Clinic OS foundation</p>
    </footer>
  </body>
</html>
