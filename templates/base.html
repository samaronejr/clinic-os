{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}Clinic OS secure clinical workspace.{% endblock %}">
    <title>{% block title %}Clinic OS{% endblock %}</title>
    <link rel="icon" href="{% static 'icons/clinic-os.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/clinic-os.css' %}">
    <link rel="stylesheet" href="{% static 'css/clinic-os-auth.css' %}">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/auth-ui.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <p class="brand">Clinic OS</p>
    </header>
    <main id="main-content" tabindex="-1">
      {% block content %}
      <section aria-labelledby="shell-heading">
        <h1 id="shell-heading">Foundation shell</h1>
        <p>The Clinic OS project shell is running.</p>
      </section>
      {% endblock %}
    </main>
    <footer class="site-footer">
      <p>Clinic OS foundation</p>
    </footer>
  </body>
</html>
