{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Clinic OS{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/clinic-os.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"
            defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <p class="brand">Clinic OS</p>
    </header>
    <main id="main-content" tabindex="-1">
      {% block content %}
      <section aria-labelledby="shell-heading">
        <h1 id="shell-heading">Foundation shell</h1>
        <p>The Clinic OS project shell is running.</p>
      </section>
      {% endblock %}
    </main>
    <footer class="site-footer">
      <p>Clinic OS foundation</p>
    </footer>
  </body>
</html>
