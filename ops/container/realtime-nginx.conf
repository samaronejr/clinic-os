# Same origin keeps CSP connect-src 'self'; POST stays WSGI, only GET is ASGI.
map $request_method $stream_upstream {
    default http://web:8000;
    GET http://realtime:8001;
}
server {
    listen 8080;
    server_name localhost;
    resolver 127.0.0.11 valid=10s; # Docker's internal DNS for the method map.
    # Stream tickets are credentials; never log a query string.
    access_log off;
    location = /rt/stream {
        proxy_pass $stream_upstream;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 620s;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
    }
}
