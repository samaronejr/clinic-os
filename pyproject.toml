[project]
name = "clinic-os-foundation"
version = "0.1.0"
description = "Clinic OS foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "celery",
  "django==5.2.*",
  "django-environ",
  "django-otp==1.7.*",
  "djangorestframework",
  "gunicorn",
  "psycopg[binary]>=3.2",
  "qrcode[pil]",
  "redis",
  "rfc8785",
  "sentry-sdk[django]",
  "tzdata==2026.3",
  "whitenoise==6.12.0",
]

[dependency-groups]
browser = [
  "playwright==1.61.0",
  "pytest-playwright==0.8.0",
]
dev = [
  "django-stubs",
  "djangorestframework-stubs",
  "mypy",
  "model-bakery",
  "pip-audit>=2.10.1,<3",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "FBT001",
  "FBT002",
  "FIX002",
  "ISC001",
  "TD002",
  "TD003",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"config/**/*.py" = ["D"]
"config/settings/test.py" = ["D", "S105"]
"ops/container/gunicorn_no_proxy.py" = ["D100"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["config.settings.dev", "config.settings.prod"]
allow_redefinition = true

[[tool.mypy.overrides]]
module = "ops.container.gunicorn_no_proxy"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_otp", "django_otp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.coverage.run]
omit = ["*/migrations/*"]
