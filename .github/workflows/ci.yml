name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        # Disposable CI-only credentials; never use these values in production.
        env:
          POSTGRES_DB: clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TEST_DATABASE_NAME: test_clinic
      CLINIC_OWNER_PASSWORD: clinic_owner_password
      CLINIC_APP_PASSWORD: clinic_app_password
      CLINIC_SUPER_PASSWORD: clinic_super_password
      APP_DATABASE_URL: postgresql://clinic_app:clinic_app_password@localhost:5432/clinic
      MIGRATION_DATABASE_URL: postgresql://clinic_owner:clinic_owner_password@localhost:5432/clinic
      TEST_SUPERUSER_DATABASE_URL: postgresql://clinic_super:clinic_super_password@localhost:5432/clinic
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.11.28"
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Bootstrap database roles and precreated test database
        run: make db-bootstrap POSTGRES_CONTAINER="${{ job.services.postgres.id }}"
      - name: Apply migrations as clinic_owner
        run: make migrate
      - name: Verify database runtime posture
        run: make db-posture POSTGRES_CONTAINER="${{ job.services.postgres.id }}"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        run: uv run mypy .
      - name: Test critical apps with coverage
        run: >-
          uv run pytest --reuse-db
          --cov=apps.audit
          --cov=apps.identity
          --cov=apps.tenancy
          --cov-report=term-missing
          --cov-fail-under=90
          tests
      - name: Audit locked Python dependencies
        run: uv run pip-audit --local

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check workflow syntax
        uses: raven-actions/actionlint@v2
