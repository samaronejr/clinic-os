# Clinic Ops website claims registry (todo 70).
#
# claims: every statement of fact in the templates under templates/website/
# (subfolders included) and in the help guides. On pages the element
# marked data-claim="<id>" directly wraps the claim's exact English msgid;
# help-guide claims (surface: guides) are strings in apps/website/guides.py.
# evidence_ref names a tracked repository file that supports the claim, and
# each evidence_quote must appear in it (whitespace-normalized).
# non_claims: every other text shown (headings, navigation, labels,
# instructions, advice, fictional illustrations, brand rules, metadata), each
# with a reason from NON_CLAIM_REASONS in tests/website/test_claims.py.
# That test reads every template under templates/website/ (subfolders
# included) and the help guides: it fails on any text there in neither list
# and on any template form it cannot classify. Its route test fails when a
# website route (the website urlconf, root routes of website views and every
# route under WEBSITE_PUBLIC in apps/tenancy/middleware.py) renders a
# template outside that tree and off its allowlist (the text-free icon
# include, the app-wide 404 page). Declared limits: the tests do not check
# values the views compute at request time or the pt-BR translations, and
# the route test renders each route once, anonymously, with no query string.
# Testimonials, certifications and metrics
# would need the same evidence; none exists (PRODUCT.md, Evidence on Hand).
version: 1
# The pricing page stays hidden (404, unlinked) until todo 74 publishes
# packaging with an owner approval record; the test pins this state.
pricing:
  status: hidden
  owner_approval_ref: null
