    surface: guides
    evidence_ref: templates/scribe/review.html
    evidence_quote:
      - "Continue the note manually"
  - id: g-nothing-automatic
    claim: "Nothing is applied or finalized automatically. Finalizing the note is a separate step."
    surface: guides
    evidence_ref: templates/scribe/review.html
    evidence_quote:
      - "Nothing is applied or finalized automatically."
      - "The note is still a draft; finalization is a separate action."
  - id: g-patient-summary
    claim: "Use your clinic's booking code and private invitation to choose a time, without sharing the reason for your visit."
    surface: guides
    evidence_ref: templates/crm/public.html
    evidence_quote:
      - "No diagnosis or reason for your visit is requested here."
  - id: g-not-emergency
    claim: "This page is not monitored for emergencies. In an emergency, seek urgent care."
    surface: guides
    evidence_ref: templates/crm/public.html
    evidence_quote:
      - "This page is not monitored for emergencies."
  - id: g-portal
    claim: "Your appointment stays available in the patient portal."
    surface: guides
    evidence_ref: templates/crm/public.html
    evidence_quote:
      - "Your appointment stays available in the patient portal."
  - id: g-autosave
    claim: "With JavaScript on, the draft is saved on the server as you type."
    surface: guides
    evidence_ref: templates/ehr/encounter.html
    evidence_quote:
      - "With JavaScript on, the draft is saved to the server while you type"
