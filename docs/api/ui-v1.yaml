openapi: 3.0.3
info:
  title: Clinic Ops internal UI API
  version: '1'
  description: RPC-style POST endpoints for first-party UI surfaces. Record identifiers
    travel only in request bodies. Session authentication with the X-CSRFToken header;
    errors are {code, message_key}.
paths:
  /api/ui/v1/agenda/board/:
    post:
      operationId: agenda_board_query
      description: |-
        Adapt ``scheduling.view_agenda_board``; unknown and foreign clinics match.

        Deviation from the todo 24 plan wording, accepted provisionally pending gate review: the plan widens ``agenda/query`` to the multi-view board. ``agenda/query`` keeps its pinned response keys and required ``clinic_id``, so the day, week, month and list board is this separate endpoint instead.
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaBoardQueryRequest'
        required: true
      security:
      - sessionCookie: []
        csrfHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaBoard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/ui/v1/agenda/query/:
    post:
      operationId: agenda_query
      description: Adapt ``scheduling.view_agenda``; unknown and foreign clinics match.
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaQueryRequest'
        required: true
      security:
      - sessionCookie: []
        csrfHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/ui/v1/command/search/:
    post:
      operationId: command_search
      description: Adapt ``core.search_commands``; unknown and foreign clinics answer
        ``[]``.
      tags:
      - command
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandSearchRequest'
        required: true
      security:
      - sessionCookie: []
        csrfHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    AgendaBoard:
      type: object
      description: 'Adapt ``scheduling.AgendaBoard``: slots and appointments of one
        view.'
      properties:
        view:
          allOf:
          - $ref: '#/components/schemas/AgendaBoardViewEnum'
          readOnly: true
        anchor:
          type: string
          format: date
          readOnly: true
        first_day:
          type: string
          format: date
          readOnly: true
        last_day:
          type: string
          format: date
          readOnly: true
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/BoardLane'
          readOnly: true
        slots:
          type: array
          items:
            type: string
          readOnly: true
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/BoardAppointment'
          readOnly: true
        occupancy:
          type: array
          items:
            $ref: '#/components/schemas/Occupancy'
          readOnly: true
        counts:
          type: array
          items:
            $ref: '#/components/schemas/DayCount'
          readOnly: true
        can_move:
          type: boolean
          readOnly: true
        can_book:
          type: boolean
          readOnly: true
        truncated:
          type: boolean
          readOnly: true
      required:
      - anchor
      - appointments
      - can_book
      - can_move
      - counts
      - first_day
      - lanes
      - last_day
      - occupancy
      - slots
      - truncated
      - view
    AgendaBoardFilters:
      type: object
      description: Optional board filters; unknown catalog entries answer ``invalid_input``.
      properties:
        professional_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        service_type_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusEnum'
    AgendaBoardQueryRequest:
      type: object
      description: |-
        POST body of ``agenda/board``: the range is the view containing ``date``.

        ``clinic_id`` is optional: without it the shell's current clinic is used.
        Record selectors never appear here; filters name only catalog entries.
      properties:
        clinic_id:
          type: string
          format: uuid
        view:
          $ref: '#/components/schemas/AgendaBoardViewEnum'
        date:
          type: string
          format: date
          description: Clinic-local civil date from 2000-01-01 to 2199-12-31; the
            day, ISO week or month containing it.
        filters:
          $ref: '#/components/schemas/AgendaBoardFilters'
      required:
      - date
      - view
    AgendaBoardViewEnum:
      enum:
      - day
      - week
      - month
      - list
      type: string
      description: |-
        * `day` - day
        * `week` - week
        * `month` - month
        * `list` - list
    AgendaItem:
      type: object
      description: 'Adapt ``scheduling.AgendaItem``: one clinic-local appointment
        row.'
      properties:
        appointment_id:
          type: string
          format: uuid
          readOnly: true
        patient_display_name:
          type: string
          readOnly: true
        practitioner_id:
          type: string
          format: uuid
          readOnly: true
        practitioner_display_identifier:
          type: string
          readOnly: true
        start_local:
          type: string
          readOnly: true
        end_local:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - appointment_id
      - end_local
      - patient_display_name
      - practitioner_display_identifier
      - practitioner_id
      - start_local
      - status
    AgendaLedgerViewEnum:
      enum:
      - day
      - week
      type: string
      description: |-
        * `day` - day
        * `week` - week
    AgendaPage:
      type: object
      description: 'Adapt ``scheduling.AgendaPage``: one bounded agenda page.'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'
          readOnly: true
        view:
          allOf:
          - $ref: '#/components/schemas/AgendaLedgerViewEnum'
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        page:
          type: integer
          readOnly: true
        total:
          type: integer
          readOnly: true
        page_count:
          type: integer
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - date
      - end_at
      - items
      - page
      - page_count
      - start_at
      - total
      - view
    AgendaQueryRequest:
      type: object
      description: POST body of ``agenda/query``; the clinic identifier stays in the
        body.
      properties:
        clinic_id:
          type: string
          format: uuid
        view:
          $ref: '#/components/schemas/AgendaLedgerViewEnum'
        date:
          type: string
          format: date
          description: Clinic-local civil date from 2000-01-01 to 2199-12-31.
        page:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
      required:
      - clinic_id
      - date
      - view
    BoardAppointment:
      type: object
      description: Adapt ``scheduling.BoardAppointment``; no birth date or contact
        data.
      properties:
        appointment_id:
          type: string
          format: uuid
          readOnly: true
        patient_display_name:
          type: string
          readOnly: true
        practitioner_id:
          type: string
          format: uuid
          readOnly: true
        resource_ids:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        service_type_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        start_local:
          type: string
          readOnly: true
        end_local:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        revision:
          type: integer
          readOnly: true
        movable:
          type: boolean
          readOnly: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
        hold_until:
          type: string
          readOnly: true
        hold_expiring:
          type: boolean
          readOnly: true
      required:
      - actions
      - appointment_id
      - end_local
      - hold_expiring
      - hold_until
      - movable
      - patient_display_name
      - practitioner_id
      - resource_ids
      - revision
      - service_type_id
      - start_local
      - status
    BoardLane:
      type: object
      description: 'Adapt ``scheduling.BoardLane``: a professional, room or equipment
        lane.'
      properties:
        kind:
          type: string
          readOnly: true
        lane_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - kind
      - label
      - lane_id
    CodeEnum:
      enum:
      - access_denied
      - csrf_failed
      - step_up_required
      - malformed_body
      - invalid_input
      - method_not_allowed
      - not_acceptable
      - unsupported_media_type
      - throttled
      - not_found
      - internal_error
      type: string
      description: |-
        * `access_denied` - access_denied
        * `csrf_failed` - csrf_failed
        * `step_up_required` - step_up_required
        * `malformed_body` - malformed_body
        * `invalid_input` - invalid_input
        * `method_not_allowed` - method_not_allowed
        * `not_acceptable` - not_acceptable
        * `unsupported_media_type` - unsupported_media_type
        * `throttled` - throttled
        * `not_found` - not_found
        * `internal_error` - internal_error
    CommandResult:
      type: object
      description: |-
        One allowed palette row.

        ``token`` stands for a record selector (a patient) held server-side in
        the session; POST it as ``token`` to ``action_url_name``. ``href`` is the
        state-free path of a destination or action and is null for tokenized
        rows. ``label``/``meta`` of a patient row are the name and age only.
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        meta:
          type: string
          readOnly: true
        action_url_name:
          type: string
          readOnly: true
        token:
          type: string
          readOnly: true
          nullable: true
        href:
          type: string
          readOnly: true
          nullable: true
        html:
          type: string
          readOnly: true
          description: Server-rendered, escaped option markup for the workspace combobox.
        label:
          type: string
          readOnly: true
      required:
      - action_url_name
      - href
      - html
      - kind
      - label
      - meta
      - token
    CommandSearchRequest:
      type: object
      description: |-
        POST body of ``command/search``; search text never travels in a URL.

        ``clinic_id`` is optional: without it the shell's current clinic is used.
        An unknown or foreign clinic answers exactly like a query with no match.
      properties:
        q:
          type: string
          maxLength: 100
        clinic_id:
          type: string
          format: uuid
        page_path:
          type: string
          description: Path of the page the palette was opened on (never a record).
          maxLength: 200
          pattern: ^/[A-Za-z0-9/_.-]*$
      required:
      - q
    DayCount:
      type: object
      description: 'Adapt ``scheduling.DayCount``: appointments starting on one date.'
      properties:
        day:
          type: string
          format: date
          readOnly: true
        total:
          type: integer
          readOnly: true
      required:
      - day
      - total
    Error:
      type: object
      description: The ``{code, message_key}`` refusal body shared by every endpoint.
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message_key:
          type: string
      required:
      - code
      - message_key
    KindEnum:
      enum:
      - destination
      - action
      - saved_view
      - save_view
      - archive_view
      - patient
      - notice
      type: string
      description: |-
        * `destination` - destination
        * `action` - action
        * `saved_view` - saved_view
        * `save_view` - save_view
        * `archive_view` - archive_view
        * `patient` - patient
        * `notice` - notice
    Occupancy:
      type: object
      description: 'Adapt ``scheduling.Occupancy``: a busy interval, other units unnamed.'
      properties:
        lane_id:
          type: string
          format: uuid
          readOnly: true
        start_local:
          type: string
          readOnly: true
        end_local:
          type: string
          readOnly: true
        other_unit:
          type: boolean
          readOnly: true
      required:
      - end_local
      - lane_id
      - other_unit
      - start_local
    StatusEnum:
      enum:
      - scheduled
      - cancelled
      - requested
      - held
      - arrived
      - in_progress
      - completed
      - no_show
      type: string
      description: |-
        * `scheduled` - scheduled
        * `cancelled` - cancelled
        * `requested` - requested
        * `held` - held
        * `arrived` - arrived
        * `in_progress` - in_progress
        * `completed` - completed
        * `no_show` - no_show
  securitySchemes:
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
