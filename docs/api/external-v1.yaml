components:
  schemas:
    Appointment:
      type: object
      description: One appointment with opaque ids; no clinical content.
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        patient:
          type: string
        practitioner:
          type: string
        service_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - end_at
      - id
      - patient
      - practitioner
      - service_type
      - start_at
      - status
      - updated_at
    AppointmentPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        next_cursor:
          type: string
          nullable: true
      required:
      - data
      - next_cursor
    AppointmentStatusEnum:
      enum:
      - requested
      - held
      - booked
      - arrived
      - in_progress
      - completed
      - cancelled
      - expired
      - no_show
      type: string
      description: |-
        * `requested` - requested
        * `held` - held
        * `booked` - booked
        * `arrived` - arrived
        * `in_progress` - in_progress
        * `completed` - completed
        * `cancelled` - cancelled
        * `expired` - expired
        * `no_show` - no_show
    Availability:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityEntry'
        truncated:
          type: boolean
      required:
      - data
      - truncated
    AvailabilityEntry:
      type: object
      description: A working window, a busy interval or a clinic closure.
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        practitioner:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
      required:
      - end_at
      - kind
      - practitioner
      - start_at
    Error:
      type: object
      description: The ``{code, message_key}`` refusal body.
      properties:
        code:
          type: string
        message_key:
          type: string
      required:
      - code
      - message_key
    ErrorEnum:
      enum:
      - invalid_request
      - invalid_client
      - invalid_scope
      - unsupported_grant_type
      - temporarily_unavailable
      type: string
      description: |-
        * `invalid_request` - invalid_request
        * `invalid_client` - invalid_client
        * `invalid_scope` - invalid_scope
        * `unsupported_grant_type` - unsupported_grant_type
        * `temporarily_unavailable` - temporarily_unavailable
    EventsEnum:
      enum:
      - appointment.created
      - appointment.status_changed
      - appointment.rescheduled
      - invoice.status_changed
      type: string
      description: |-
        * `appointment.created` - appointment.created
        * `appointment.status_changed` - appointment.status_changed
        * `appointment.rescheduled` - appointment.rescheduled
        * `invoice.status_changed` - invoice.status_changed
    GrantTypeEnum:
      enum:
      - client_credentials
      type: string
      description: '* `client_credentials` - client_credentials'
    Invoice:
      type: object
      description: Issued invoice status in integer BRL centavos.
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        amount_minor:
          type: integer
        currency:
          type: string
        appointment:
          type: string
          nullable: true
        patient:
          type: string
        issued_at:
          type: string
          format: date-time
      required:
      - amount_minor
      - appointment
      - currency
      - id
      - issued_at
      - patient
      - status
    InvoicePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        next_cursor:
          type: string
          nullable: true
      required:
      - data
      - next_cursor
    InvoiceStatusEnum:
      enum:
      - open
      - paid
      - cancelled
      type: string
      description: |-
        * `open` - open
        * `paid` - paid
        * `cancelled` - cancelled
    KindEnum:
      enum:
      - window
      - busy
      - closed
      type: string
      description: |-
        * `window` - window
        * `busy` - busy
        * `closed` - closed
    OAuthError:
      type: object
      description: RFC 6749 section 5.2 token error body.
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnum'
      required:
      - error
    Patient:
      type: object
      description: 'Minimal demographics: the display name and birth date only.'
      properties:
        id:
          type: string
        display_name:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
      required:
      - birth_date
      - display_name
      - id
    StateEnum:
      enum:
      - active
      - revoked
      type: string
      description: |-
        * `active` - active
        * `revoked` - revoked
    TokenRequest:
      type: object
      description: Client credentials grant; credentials in Basic auth or in the form.
      properties:
        grant_type:
          $ref: '#/components/schemas/GrantTypeEnum'
        scope:
          type: string
          maxLength: 200
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
          maxLength: 67
      required:
      - grant_type
    TokenResponse:
      type: object
      description: RFC 6749 section 5.1 token response.
      properties:
        access_token:
          type: string
        token_type:
          $ref: '#/components/schemas/TokenTypeEnum'
        expires_in:
          type: integer
        scope:
          type: string
      required:
      - access_token
      - expires_in
      - scope
      - token_type
    TokenTypeEnum:
      enum:
      - Bearer
      type: string
      description: '* `Bearer` - Bearer'
    WebhookCreate:
      type: object
      description: An HTTPS endpoint without query, fragment or credentials.
      properties:
        url:
          type: string
          maxLength: 2048
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventsEnum'
          maxItems: 4
          minItems: 1
      required:
      - events
      - url
    WebhookSecret:
      type: object
      description: A registration plus its signing secret, returned on create and
        rotate.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventsEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        secret_version:
          type: integer
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        secret:
          type: string
      required:
      - created_at
      - events
      - id
      - revoked_at
      - secret
      - secret_version
      - state
      - url
    WebhookSubscription:
      type: object
      description: One endpoint registration of the calling client.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventsEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        secret_version:
          type: integer
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - events
      - id
      - revoked_at
      - secret_version
      - state
      - url
    WebhookSubscriptionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
      required:
      - data
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    clientBasic:
      type: http
      scheme: basic
