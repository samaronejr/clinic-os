openapi: 3.0.3
info:
  title: Clinic Ops external API
  version: '1'
  description: Versioned partner API. OAuth 2.0 client credentials issue 15-minute
    bearer tokens limited to the client's scopes and clinic. Patient-linked records
    use opaque external ids; unknown and foreign ids are the same 404. Every client
    has a per-minute token bucket (429 with Retry-After). Writes require an Idempotency-Key.
    Errors are {code, message_key}; the token endpoint uses RFC 6749 error bodies.
paths:
  /api/v1/appointments:
    get:
      operationId: appointments_list
      description: Return one keyset page ordered by start time and id.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: The previous page's next_cursor.
      - in: query
        name: end
        schema:
          type: string
        description: ISO 8601 with offset.
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-100, default 50.
      - in: query
        name: start
        schema:
          type: string
        description: ISO 8601 with offset.
        required: true
      tags:
      - appointments
      security:
      - bearerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, expired or revoked bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The token lacks this resource's scope.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before the next attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The client's token bucket is empty.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before the next attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate metering is unavailable; nothing ran.
  /api/v1/appointments/{appointment_id}:
    get:
      operationId: appointments_retrieve
      description: Unknown, foreign and malformed ids are the same 404.
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
        description: An opaque external id returned by this API.
        required: true
      tags:
      - appointments
      security:
      - bearerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, expired or revoked bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The token lacks this resource's scope.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before the next attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The client's token bucket is empty.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before the next attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate metering is unavailable; nothing ran.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown, foreign and malformed ids alike.
  /api/v1/availability:
    get:
      operationId: availability_list
