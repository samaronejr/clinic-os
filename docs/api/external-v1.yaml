  /api/v1/oauth/token:
    post:
      operationId: oauth_token
      description: Issue a 15-minute bearer token for an active, authorized client.
      tags:
      - oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - clientBasic: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: invalid_request or invalid_scope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: invalid_client for any refusal.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before the next attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: Token requests are metered too.
        '503':
          headers:
